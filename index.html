<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin | Knit & Bloom</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/png"
        href="https://img.freepik.com/premium-vector/woman-using-laptop-vector-illustration-style_717774-6590.jpg?semt=ais_hybrid&w=740&q=80" />

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

    <header class="header">
        <div class="cont-header-shida">
            <a href="index.html" class="nav-link">← Back to site</a>
            <h1>Admin Panel</h1>
        </div>

    </header>




    <main class="container">
        <section class="section soft" id="manage" aria-labelledby="manage-title">
            <div class="container">
                <div class="section-head">
                    <div>
                        <h2 id="manage-title">Manage</h2>
                    </div>
                </div>
                <div class="manage-grid">
                    <form class="panel" aria-label="Add or edit a product">
                        <h3>Add / Edit item</h3>
                        <div class="form-grid">
                            <div class="field">
                                <label for="mTitle">Title</label>
                                <input id="mTitle" name="title" type="text" placeholder="Blush Merino Yarn" />
                            </div>

                            <div class="field">
                                <label for="mPrice">Price</label>
                                <input id="mPrice" name="price" type="number" min="0" step="0.01" placeholder="12.00" />
                            </div>

                            <div class="field">
                                <label for="mCategory">Category</label>
                                <select id="mCategory" name="category">
                                    <option value="yarn">Yarn</option>
                                    <option value="kits">Kits</option>
                                    <option value="needles">Needles</option>
                                </select>
                            </div>

                            <div class="field wide">
                                <label for="mDesc">Description</label>
                                <textarea id="mDesc" name="description" rows="4"
                                    placeholder="Short description…"></textarea>
                            </div>

                            <div class="field">
                                <label for="imageUrl">Image URL</label>
                                <input id="imageUrl" name="imageUrl" type="url" placeholder="https://..." />
                            </div>

                            <div class="field">
                                <label class="check">
                                    <input type="checkbox" name="inStock" />
                                    <span>In stock</span>
                                </label>
                            </div>
                        </div>

                        <div class="panel-actions">
                            <button class="btn primary" type="button" data-action="create">Create</button>
                            <button class="btn glass" type="button" data-action="update">Update</button>
                            <button class="btn danger" type="button" data-action="delete">Delete</button>
                            <button class="btn glass" type="reset" data-action="clear">Clear</button>
                        </div>
                    </form>

                    <section class="panel" aria-label="Items list (Read)">
                        <div class="panel-top">
                            <h3>Items</h3>
                            <button class="btn small primary" type="button" data-action="fetch">Fetch</button>
                        </div>

                        <div class="manage-list" id="manageList"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script defer src="script.js"></script>
</body>

</html>
